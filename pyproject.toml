[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qetool"
version = "0.1.0"
dependencies = ["numpy", "matplotlib"]

[project.optional-dependencies]
ase = ["ase"]

[project.scripts]
qe = "qe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
